<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <!-- Login Page -->
    <div id="login-page" class="page active">
        <h1>Student Performance Predictor</h1>

        <div class="progress-bar">
            <div class="progress" style="width:33%;"></div>
        </div>

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <button id="login-btn">Next</button>
    </div>

    <!-- Student Details -->
    <div id="details-page" class="page">

        <h1>Student Details</h1>

        <div class="progress-bar">
            <div class="progress" style="width:66%;"></div>
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" id="age">
        </div>

        <div class="form-group">
            <label>Gender</label>
            <select id="gender">
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Study Hours Per Day</label>
            <input type="number" id="hours">
        </div>

        <div class="form-group">
            <label>Attendance (%)</label>
            <input type="number" id="attendance">
        </div>

        <div class="form-group">
            <label>Previous Semester Marks (%)</label>
            <input type="number" id="marks">
        </div>

        <div class="form-group">
            <label>Learning Goal</label>

            <select id="goal">
                <option value="">Select Goal</option>
                <option value="pass">Pass Exams</option>
                <option value="improve">Improve Grades</option>
                <option value="80">Score Above 80%</option>
                <option value="90">Score Above 90%</option>
                <option value="maintain">Maintain Performance</option>
            </select>
        </div>

        <button id="predict-btn">Predict Performance</button>

    </div>

    <!-- Result Page -->

    <div id="result-page" class="page">

        <h1>Prediction Result</h1>

        <div class="progress-bar">
            <div class="progress" style="width:100%;"></div>
        </div>

        <div class="result-box">

            <h2>Student Details</h2>

            <div id="student-summary"></div>

        </div>

        <div class="result-box">

            <h2>Performance Prediction</h2>

            <div id="prediction"></div>

        </div>

        <div class="result-box">

            <h2>Recommendations</h2>

            <div id="tips"></div>

        </div>

        <button id="restart-btn">Start Over</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
